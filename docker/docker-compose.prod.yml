name: your-persona-ui-prod

networks:
  shared:
    external: true
    name: your-persona-shared

services:
  ui:
    image: ghcr.io/aprxty3/your_persona_ui:${UI_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_INTERNAL_URL=https://your-personas.duckdns.org
    networks:
      - shared
