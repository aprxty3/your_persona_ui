# CI/CD — mirrors the controller-api pipeline shape:
#   push develop  -> checks -> docker build+push (staging build-args) -> auto-deploy staging
#   push main     -> checks -> docker build+push (production build-args) -> deploy production
#                    (gated by the `production` environment's required-reviewer rule)
#   pull_request  -> checks + docker build only (never pushed)
#
# NEXT_PUBLIC_* values are inlined into the bundle AT BUILD TIME (see Dockerfile),
# so the staging and production images are built with different build-args and are
# NOT interchangeable — each deploy job consumes the sha tag from its own branch run.
#
# Deploy jobs are safe no-ops until the VPS secrets are configured
# (VPS_SSH_KEY/VPS_HOST/VPS_USER) and the FE stack exists on the VPS —
# see the "[ops] FE VPS deploy runbook" issue for the full setup checklist.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history, not just HEAD
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: next lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: tsc --noEmit
        run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: bun test
        # Guarded: `bun test` exits non-zero when zero test files exist, which would
        # permanently red-flag the pipeline before the first test is written.
        # Remove the guard once the apiClient unit tests land (tracked in issues).
        run: |
          if find . -path ./node_modules -prune -o -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print | grep -q .; then
            bun test
          else
            echo "::notice::No test files yet — skipping. Write apiClient envelope/refresh tests to close M1 DoD."
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: next build (fast feedback — NEXT_PUBLIC_* left empty, contract check only)
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, build, secrets]
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha_tag: sha-${{ github.sha }}
    env:
      # Build-args are branch-dependent because NEXT_PUBLIC_* is inlined at build time.
      # Repo Variables (Settings > Secrets and variables > Actions > Variables) override
      # the defaults; Turnstile falls back to Cloudflare's always-pass TEST sitekey so
      # staging works out of the box — set NEXT_PUBLIC_TURNSTILE_SITE_KEY before real launch.
      API_BASE_URL: ${{ github.ref == 'refs/heads/main'
        && (vars.NEXT_PUBLIC_API_BASE_URL_PROD || 'https://your-personas.duckdns.org')
        || (vars.NEXT_PUBLIC_API_BASE_URL_STG || 'https://your-personas-stg.duckdns.org') }}
      TURNSTILE_SITE_KEY: ${{ github.ref == 'refs/heads/main'
        && (vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA')
        || '1x00000000000000000000AA' }}
      POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY || '' }}
      POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
      - name: Set up QEMU (emulation for non-native target platforms)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (push only on branch pushes, never on PRs)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.API_BASE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ env.POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # Set once the FE production DuckDNS name is registered (see ops runbook issue).
      SMOKE_URL: ${{ vars.FE_PROD_URL || '' }}
    steps:
      - name: SSH deploy — pull & recreate
        if: env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_sha_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/your-persona/your-persona-ui
            git fetch origin main
            git reset --hard origin/main
            export UI_IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker/docker-compose.prod.yml pull
            docker compose -f docker/docker-compose.prod.yml up -d --no-build --remove-orphans
            docker image prune -f
      - name: Smoke test
        if: env.VPS_SSH_KEY != '' && env.SMOKE_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$SMOKE_URL"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SMOKE_URL: ${{ vars.FE_STAGING_URL || '' }}
    steps:
      - name: SSH deploy — pull & recreate staging
        if: env.VPS_SSH_KEY != ''
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_sha_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/your-persona/your-persona-ui-staging
            git fetch origin develop
            git reset --hard origin/develop
            export UI_IMAGE_TAG="$IMAGE_TAG"
            docker compose -f docker/docker-compose.staging.yml pull
            docker compose -f docker/docker-compose.staging.yml up -d --no-build --remove-orphans
            docker image prune -f
      - name: Smoke test
        if: env.VPS_SSH_KEY != '' && env.SMOKE_URL != ''
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$SMOKE_URL"
